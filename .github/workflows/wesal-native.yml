name: Build & Publish WESAL Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Clean Gradle cache
        run: rm -rf WesalAndroid/.gradle
      - name: Build Debug APK
        run: |
          cd WesalAndroid
          gradle assembleDebug --no-daemon

      - name: Copy & Verify WESAL.apk + Signing Fingerprints
        run: |
          mkdir -p release-assets
          cp WesalAndroid/app/build/outputs/apk/debug/app-debug.apk release-assets/WESAL.apk
          keytool -printcert -jarfile release-assets/WESAL.apk | grep -E "SHA1|SHA256" || true

      - name: Upload WESAL.apk workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WESAL-apk
          path: release-assets/WESAL.apk

      - name: Publish WESAL.apk to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wesal-latest
          name: WESAL Messenger Latest APK
          make_latest: true
          files: release-assets/WESAL.apk
          body: |
            Official WESAL Messenger Android APK build (`com.wesal.messenger`).
            Direct download URL used by `/join` invite redirect:
            `https://github.com/${{ github.repository }}/releases/latest/download/WESAL.apk`
