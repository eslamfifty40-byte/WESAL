name: WESAL Android Build & Test

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project root
        id: project
        run: |
          if [ -f "./gradlew" ] && [ -f "./app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./WesalAndroid/gradlew" ] && [ -f "./WesalAndroid/app/build.gradle.kts" ]; then
            echo "dir=WesalAndroid" >> "$GITHUB_OUTPUT"
          else
            echo "Could not locate WesalAndroid Gradle root (missing gradlew or app/build.gradle.kts)."
            exit 1
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Clean Gradle project
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew clean --no-daemon

      - name: Run Debug Unit Tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK & signing certificate
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          unzip -tq "$APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep -E "SHA1:|SHA256:" || true

      - name: Upload Unit Test Reports & Build Logs (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wesal-test-reports-and-logs
          if-no-files-found: ignore
          path: |
            ${{ steps.project.outputs.dir }}/app/build/test-results/
            ${{ steps.project.outputs.dir }}/app/build/reports/tests/
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs/
          retention-days: 14

      - name: Upload WESAL Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WESAL-Messenger-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
