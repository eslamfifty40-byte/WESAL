name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000
      - run: npm i @capacitor/core @capacitor/android --legacy-peer-deps
      - run: npm i -D @capacitor/cli @capacitor/assets --legacy-peer-deps
      - run: npm run build
      - run: rm -rf android capacitor.config.*
      - run: npx cap init 'سبق' com.eslam.sabq --web-dir=dist
      - run: npx cap add android
      - run: sh patch-android.sh
      - run: mkdir -p assets && cp icon1.png assets/icon-only.png
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: pip install pillow
      - run: python3 fix_icon.py
      - run: python3 fix_perm.py
      - run: python3 pad_icon.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SABQ-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
